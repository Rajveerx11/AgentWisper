name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-and-package:
    name: Windows / Python 3.11
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Check dependency lock
        run: uv lock --check

      - name: Lint Python
        run: uv run ruff check src tests

      - name: Check Python formatting
        run: uv run ruff format --check src tests

      - name: Test
        run: uv run pytest -q

      - name: Check JavaScript syntax
        run: node --check src/agent_whisper/web/app.js

      - name: Build Python distributions
        run: uv build

      - name: Build Windows application
        shell: pwsh
        run: ./build.ps1

      - name: Verify package contents
        shell: pwsh
        run: |
          $required = @(
            "dist/AgentWisper/AgentWisper.exe",
            "dist/AgentWisper/LICENSE",
            "dist/AgentWisper/NOTICE.md",
            "dist/AgentWisper/THIRD_PARTY_NOTICES.md",
            "dist/AgentWisper/licenses"
          )
          foreach ($path in $required) {
            if (!(Test-Path -LiteralPath $path)) {
              throw "Required package content missing: $path"
            }
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentwisper-windows-${{ github.sha }}
          path: dist/AgentWisper
          if-no-files-found: error
          retention-days: 7
