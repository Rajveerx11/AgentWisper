name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m pytest
      - run: python -m PyInstaller --noconfirm --clean AgentWisper.spec
      - shell: pwsh
        run: |
          if (!(Test-Path "dist/AgentWisper/AgentWisper.exe")) {
            throw "Packaged desktop executable was not created."
          }
