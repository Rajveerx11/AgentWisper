name: Feature request
description: Propose one focused developer-dictation improvement.
title: "[Feature]: "
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: This request describes one focused problem.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What developer-dictation workflow is currently difficult?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe behavior, not an implementation mandate.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround or alternatives

  - type: textarea
    id: boundaries
    attributes:
      label: Privacy and scope considerations
      description: Note audio, provider, repository, clipboard, or storage effects.

